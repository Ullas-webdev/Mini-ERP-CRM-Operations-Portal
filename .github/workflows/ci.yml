name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb?sslmode=disable"

      - name: Typecheck Backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Build Backend
        run: npm run build
        working-directory: ./backend

  frontend-ci:
    name: Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Typecheck Frontend
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Build Frontend Production Asset Bundle
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: "https://mini-erp-crm-operations-portal-z3uy.onrender.com/api/v1"


